apiVersion: apps/v1
kind: Deployment
metadata:
  name: learn-devops-api
  labels:
    app: learn-devops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learn-devops-api
  template:
    metadata:
      labels:
        app: learn-devops-api
    spec:
      containers:
        - name: learn-devops-api
          image: rohansinghdeveloper/learn-devops-api
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m" 
              memory: "512Mi" 
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaysSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaysSeconds: 10
            periodSeconds: 20
